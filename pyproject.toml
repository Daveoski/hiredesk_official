[project]
name = "hiredesk-official"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daveoski", email = "okechukwuorjionuchie@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "annotated>=0.0.2",
    "collection>=0.1.6",
    "cloudinary>=1.40",
    "fastapi[standard]>=0.142.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.4",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "resend>=2.0",
    "sqlmodel>=0.0.47",
]

[tool.fastapi]
entrypoint = "main:app"

[project.scripts]
hiredesk-official = "hiredesk_official:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
